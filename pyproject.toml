[project]
name = "dwells"
version = "0.1.0"
description = "Focused uncertainty-aware dwell detection (ua_mahalanobis) and pattern-of-life analyst app"
readme = "README.md"
authors = [
    { name = "Scott Lemke", email = "scott.r.lemke@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numba>=0.68.0",
    "numpy>=2.5.3",
    "osmnx>=2.1.1",
    "polars>=1.44.2",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
app = [
    "dash>=4.4.1",
    "dash-cytoscape>=1.0.2",
    "deckgl-dash>=0.11.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

