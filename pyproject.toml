[project]
name = "dwells"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Scott Lemke", email = "scott.r.lemke@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmob>=0.3.2",
    "fiona>=1.10.1",
    "geopandas>=1.2.0",
    "h3>=4.5.0",
    "hmmlearn>=0.3.3",
    "infostop>=0.1.9",
    "movingpandas>=0.23.0",
    "numba>=0.68.0",
    "numpy>=2.5.3",
    "osmnx>=2.1.1",
    "pandas>=3.0.6",
    "polars>=1.44.2",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
    "pyproj>=3.8.0",
    "ruptures>=1.1.10",
    "scikit-learn>=1.9.1",
    "scikit-mobility>=1.2.2",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "trackintel>=1.4.2",
]

[project.optional-dependencies]
viewer = [
    "dash>=4.4.1",
    "deckgl-dash>=0.11.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv.extra-build-dependencies]
infomap = ["setuptools<81"]
